services:
  backend:
    build:
      context: ./backend
    image: campus-rag-backend:0.1.0
    environment:
      # 应用
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-campus-rag-assistant}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # 端口仅用于容器内部监听与跨域，宿主机映射固定，故不参与透传
      FRONTEND_PORT: "5173"
      BACKEND_PORT: "8000"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173}"
      # 数据目录（容器内路径，持久化到 ./data）
      DATABASE_URL: "${DATABASE_URL:-sqlite:////app/data/sqlite/app.db}"
      CHROMA_PATH: ${CHROMA_PATH:-/app/data/chroma}
      UPLOAD_PATH: ${UPLOAD_PATH:-/app/data/uploads}
      MODEL_CACHE_PATH: ${MODEL_CACHE_PATH:-/app/data/models}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      # 演示资料（只读挂载 ./demo；不会自动导入，导入需显式触发）
      DEMO_DATASET_ENABLED: ${DEMO_DATASET_ENABLED:-true}
      DEMO_DATASET_PATH: ${DEMO_DATASET_PATH:-/app/demo}
      DEMO_DATASET_VERSION: ${DEMO_DATASET_VERSION:-2026.1}
      DEMO_JOB_POLL_SECONDS: ${DEMO_JOB_POLL_SECONDS:-2}
      DEMO_JOB_LEASE_SECONDS: ${DEMO_JOB_LEASE_SECONDS:-60}
      # Embedding：默认 local + cpu，不申请 GPU；api 模式所需 Base URL / Key / model 均可从 .env 透传
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-4}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-}
      EMBEDDING_LOCAL_FILES_ONLY: ${EMBEDDING_LOCAL_FILES_ONLY:-true}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
      # Reranker：默认 local + cpu
      RERANK_PROVIDER: ${RERANK_PROVIDER:-local}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      RERANK_DEVICE: ${RERANK_DEVICE:-cpu}
      RERANK_BATCH_SIZE: ${RERANK_BATCH_SIZE:-2}
      RERANK_REVISION: ${RERANK_REVISION:-}
      RERANK_LOCAL_FILES_ONLY: ${RERANK_LOCAL_FILES_ONLY:-true}
      RERANK_TIMEOUT_SECONDS: ${RERANK_TIMEOUT_SECONDS:-30}
      # LLM：缺省未配置，服务仍可启动；默认不指向任何真实外部 API
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_ANSWER_MAX_CHARS: ${LLM_ANSWER_MAX_CHARS:-2000}
      LLM_REWRITE_MAX_CHARS: ${LLM_REWRITE_MAX_CHARS:-300}
      # 检索与切片
      CHUNK_TARGET_CHARS: ${CHUNK_TARGET_CHARS:-550}
      CHUNK_OVERLAP_CHARS: ${CHUNK_OVERLAP_CHARS:-100}
      DENSE_TOP_K: ${DENSE_TOP_K:-12}
      KEYWORD_TOP_K: ${KEYWORD_TOP_K:-12}
      RERANK_TOP_K: ${RERANK_TOP_K:-10}
      # 检索阈值：缺省为空，安全解析为 None（不创造默认阈值）
      RETRIEVAL_SCORE_THRESHOLD: ${RETRIEVAL_SCORE_THRESHOLD:-}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./demo:/app/demo:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: campus-rag-frontend:0.1.0
    environment:
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8000/api}"
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
